<html>
    <head>
        <title>Presentation Card</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <!-- 
        Challenge:
        Use what you´ve learned about flexbox to fix our card column layout
        Make it two column instead of four column, one for the image and one for the text -->
        <div class="card">
            <div class="image-container">
                <img 
                    src="images/Artur.jpg" 
                    alt="Artur Morgan, Joker, watching fires" 
                    class="avatar">
                <div class="image-overlay">"The Joker"</div>
            </div>
            <div>
                <h3 class="shadow">Artur Morgan</h3>
                <p>Frontend Developer</p>
                <h4 class="shadow">GDL, Mexico</h4>
            </div>
                    
        </div>
    </body>
</html>
